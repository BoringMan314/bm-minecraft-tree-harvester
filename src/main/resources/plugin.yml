name: TreeHarvester
version: 1.0
main: me.rimuru.treeharvester.TreeHarvester
api-version: 1.13
author: Rimuru
description: Automatically harvest entire trees with one chop.

commands:
  treeharvester:
    description: Main TreeHarvester command
    usage: /treeharvester [reload|info|stats|optimize]
    aliases: [th, treeharvest]
    permission: treeharvester.command

permissions:
  treeharvester.use:
    description: Allows using the tree harvester feature
    default: true
  treeharvester.command:
    description: Allows using the /treeharvester command
    default: true
  treeharvester.admin:
    description: Allows using admin commands (reload, stats, optimize)
    default: op
    children:
      treeharvester.command: true
      treeharvester.use: true