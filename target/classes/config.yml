# ═══════════════════════════════════════════════════════════
#                    TreeHarvester Configuration
# ═══════════════════════════════════════════════════════════
# A smart tree harvesting plugin that respects natural generation
# Version: 1.0
# Author: Rimuru
# ═══════════════════════════════════════════════════════════

# Enable or disable the plugin functionality
enabled: true

# ═══════════════════════════════════════════════════════════
#                        PERMISSIONS
# ═══════════════════════════════════════════════════════════

# Require permission to use tree harvester
# If true, players need 'treeharvester.use' permission
# If false, all players can use the feature
require-permission: false

# ═══════════════════════════════════════════════════════════
#                        GAME MODES
# ═══════════════════════════════════════════════════════════

# Game modes where tree harvesting is allowed
# Options: survival, creative, adventure, spectator, all
# Use "all" to allow in all game modes
allowed-game-modes:
  - survival
  - creative

# ═══════════════════════════════════════════════════════════
#                         FEATURES
# ═══════════════════════════════════════════════════════════

# Automatically replant saplings after harvesting a tree
# The sapling will be placed at the base of the tree
auto-replant: true

# Delay before leaves decay (in ticks, 20 ticks = 1 second)
# Default: 40 ticks (2 seconds)
# This gives the server time to process the tree break
leaf-decay-delay-ticks: 40

# ═══════════════════════════════════════════════════════════
#                    PROTECTION PLUGINS
# ═══════════════════════════════════════════════════════════

# Respect protection plugins (WorldGuard, GriefPrevention, etc.)
# If true, tree harvesting will respect region protections
# If false, tree harvesting will work everywhere
respect-protection-plugins: true

# ═══════════════════════════════════════════════════════════
#                         MESSAGES
# ═══════════════════════════════════════════════════════════

messages:
  # Message shown when player doesn't have permission
  no-permission: "&cYou don't have permission to use TreeHarvester!"

  # Message shown when axe doesn't have enough durability
  insufficient-durability: "&cYour axe doesn't have enough durability to chop this tree!"

# ═══════════════════════════════════════════════════════════
#                    ADVANCED SETTINGS
# ═══════════════════════════════════════════════════════════

# Maximum number of logs a tree can have
# Trees larger than this won't be harvested
# This prevents performance issues with massive structures
max-tree-blocks: 1000

# Search radius for connected leaves (in blocks)
# Leaves within this radius of any log will be removed
# Default: 3 blocks
leaf-search-radius: 3

# ═══════════════════════════════════════════════════════════
#                     DATABASE SETTINGS
# ═══════════════════════════════════════════════════════════

# Database optimization interval (in minutes)
# The database will be automatically optimized on plugin disable
# Set to 0 to disable automatic optimization
# database-optimize-interval: 60

# ═══════════════════════════════════════════════════════════
#                    SUPPORTED TREE TYPES
# ═══════════════════════════════════════════════════════════
# The plugin automatically supports all tree types:
#
# Standard Trees (1.13+):
#   - Oak, Birch, Spruce, Jungle, Acacia, Dark Oak
#
# Nether Trees (1.16+):
#   - Crimson Stem, Warped Stem
#
# Mangrove (1.19+):
#   - Mangrove
#
# Cherry (1.20+):
#   - Cherry
#
# Pale Oak (1.21+):
#   - Pale Oak
#
# Special Features:
#   - 2x2 thick trees (Mega Spruce, Jungle, Dark Oak)
#   - All tree variants and directions
#   - Natural generation detection
#   - Player-placed block tracking via SQLite database
# ═══════════════════════════════════════════════════════════